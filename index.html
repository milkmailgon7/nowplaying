<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-visual">
  <meta name="theme-color" content="#1c2222">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <title>Now Playing</title>
  <link rel="stylesheet" href="style.css?v=7cf88084">
  <link rel="stylesheet" href="tablet.css?v=b7b03858">
</head>
<body>
  <!-- 배경: 두 장을 겹쳐 두고 번갈아 페이드 -->
  <div id="bg">
    <div class="bg-layer"></div>
    <div class="bg-layer"></div>
  </div>

  <!-- 가운데 앨범 아트: 두 장을 겹쳐 두고 번갈아 페이드 -->
  <div id="art">
    <img class="art-layer" alt="">
    <img class="art-layer" alt="">
  </div>

  <!-- 앨범 아트가 없을 때 가운데에 보이는 Spotify 로고 -->
  <svg id="logo" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
  </svg>

  <!-- 왼쪽 가운데 가사: 노래에 맞춰 한 줄씩 넘어감 -->
  <div id="lyrics"><div class="inner"></div></div>

  <!-- 앨범 아트 위 가운데 시계 -->
  <div id="clock">
    <div id="clock-time"></div>
    <div id="clock-date"></div>
  </div>

  <!-- 왼쪽 아래 곡 정보 + 좋아요 -->
  <div id="info">
    <div class="text">
      <div id="title"></div>
      <div id="sub"></div>
    </div>
    <button id="btn-like" class="ctl like" aria-label="좋아요">
      <svg class="i-off" viewBox="0 0 24 24"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>
      <svg class="i-on" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </button>
  </div>

  <!-- 재생이 멈췄을 때 살짝 어둡게 -->
  <div id="dim"></div>

  <!-- 아래 가운데 재생 버튼 (helper/spotify_helper.py 가 켜져 있어야 동작) -->
  <div id="controls" class="offline">
    <div class="buttons">
    <!-- 셔플: 켜짐 / 꺼짐 -->
    <button id="btn-shuffle" class="ctl toggle" aria-label="셔플 끔">
      <svg viewBox="0 0 16 16"><path d="M13.151.922a.75.75 0 1 0-1.06 1.06L13.109 3H11.16a3.75 3.75 0 0 0-2.873 1.34l-6.173 7.356A2.25 2.25 0 0 1 .39 12.5H0V14h.391a3.75 3.75 0 0 0 2.873-1.34l6.173-7.356a2.25 2.25 0 0 1 1.724-.804h1.947l-1.017 1.018a.75.75 0 0 0 1.06 1.06L15.98 3.75 13.15.922zM.391 3.5H0V2h.391c1.109 0 2.16.49 2.873 1.34L4.89 5.277l-.979 1.167-1.796-2.14A2.25 2.25 0 0 0 .39 3.5z"/><path d="M7.5 10.723l.98-1.167.957 1.14a2.25 2.25 0 0 0 1.724.804h1.947l-1.017-1.018a.75.75 0 1 1 1.06-1.06l2.829 2.828-2.829 2.828a.75.75 0 1 1-1.06-1.06L13.109 13H11.16a3.75 3.75 0 0 1-2.873-1.34l-.787-.938z"/></svg>
    </button>
    <button id="btn-prev" class="ctl" aria-label="이전 곡">
      <svg viewBox="0 0 16 16"><path d="M3.3 1a.7.7 0 0 1 .7.7v5.15l9.95-5.744a.7.7 0 0 1 1.05.606v12.575a.7.7 0 0 1-1.05.607L4 9.149V14.3a.7.7 0 0 1-.7.7H1.7a.7.7 0 0 1-.7-.7V1.7a.7.7 0 0 1 .7-.7h1.6z"/></svg>
    </button>
    <button id="btn-play" class="ctl play" aria-label="재생">
      <svg class="i-play" viewBox="0 0 16 16"><path d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.288V1.713z"/></svg>
      <svg class="i-pause" viewBox="0 0 16 16"><path d="M2.7 1a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7H2.7zm8 0a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-2.6z"/></svg>
    </button>
    <button id="btn-next" class="ctl" aria-label="다음 곡">
      <svg viewBox="0 0 16 16"><path d="M12.7 1a.7.7 0 0 0-.7.7v5.15L2.05 1.107A.7.7 0 0 0 1 1.712v12.575a.7.7 0 0 0 1.05.607L12 9.149V14.3a.7.7 0 0 0 .7.7h1.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-1.6z"/></svg>
    </button>
    <!-- 반복: 끔 → 전체 반복 → 한 곡 반복 -->
    <button id="btn-repeat" class="ctl toggle repeat" aria-label="반복 끔">
      <svg class="i-repeat" viewBox="0 0 16 16"><path d="M0 4.75A3.75 3.75 0 0 1 3.75 1h8.5A3.75 3.75 0 0 1 16 4.75v5a3.75 3.75 0 0 1-3.75 3.75H9.81l1.018 1.018a.75.75 0 1 1-1.06 1.06L6.939 12.75l2.829-2.828a.75.75 0 1 1 1.06 1.06L9.811 12h2.439a2.25 2.25 0 0 0 2.25-2.25v-5a2.25 2.25 0 0 0-2.25-2.25h-8.5A2.25 2.25 0 0 0 1.5 4.75v5A2.25 2.25 0 0 0 3.75 12H5v1.5H3.75A3.75 3.75 0 0 1 0 9.75v-5z"/></svg>
      <svg class="i-repeat-one" viewBox="0 0 16 16"><path d="M0 4.75A3.75 3.75 0 0 1 3.75 1h.75v1.5h-.75A2.25 2.25 0 0 0 1.5 4.75v5A2.25 2.25 0 0 0 3.75 12H5v1.5H3.75A3.75 3.75 0 0 1 0 9.75v-5zM12.25 2.5h-.75V1h.75A3.75 3.75 0 0 1 16 4.75v5a3.75 3.75 0 0 1-3.75 3.75H9.81l1.018 1.018a.75.75 0 1 1-1.06 1.06L6.939 12.75l2.829-2.828a.75.75 0 1 1 1.06 1.06L9.811 12h2.439a2.25 2.25 0 0 0 2.25-2.25v-5a2.25 2.25 0 0 0-2.25-2.25z"/><path d="M9.12 8.5H7.62V4.1H6.4V3.05C7.35 3 7.86 2.68 8.08 2h1.04v6.5z"/></svg>
    </button>
    </div>

    <!-- 재생바: 누르거나 끌어서 위치 이동 -->
    <div id="progress" class="slider">
      <span id="time-now" class="time">0:00</span>
      <div class="hit">
        <div class="bar"><div class="fill"></div></div>
      </div>
      <span id="time-end" class="time">0:00</span>
    </div>
  </div>

  <!-- 오른쪽 아래 볼륨: 스피커를 누르면 음소거, 막대를 누르거나 끌어서 조절 -->
  <div id="volume" class="slider offline">
    <button id="btn-mute" class="ctl vol-high" aria-label="음소거">
      <svg viewBox="0 0 16 16">
        <path d="M1.5 5.75h2.75L8 2.75v10.5l-3.75-3H1.5z"/>
        <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path class="w1" d="M10.3 5.7a3.2 3.2 0 0 1 0 4.6"/>
          <path class="w2" d="M12.3 3.7a6 6 0 0 1 0 8.6"/>
          <path class="x" d="M10.6 6.1l3.8 3.8M14.4 6.1l-3.8 3.8"/>
        </g>
      </svg>
    </button>
    <div class="hit">
      <div class="bar"><div class="fill"></div></div>
    </div>
  </div>

  <!-- 오른쪽 재생목록 -->
  <aside id="panel">
    <div class="tabs">
      <button class="tab on" data-tab="queue">대기열</button>
      <button class="tab" data-tab="playlists">플레이리스트</button>
      <button class="tab" data-tab="search">검색</button>
    </div>
    <div id="panel-msg"></div>
    <!-- 목록은 꾹 눌러 끌거나, 오른쪽 스크롤바를 끌어서 내린다 (WE는 휠을 넘겨주지 않음) -->
    <div class="lists">
      <div id="list-queue" class="list on"></div>
      <div id="list-playlists" class="list"></div>
      <!-- 검색칸을 누르면 도우미가 이 자리에 입력칸을 겹쳐 띄운다 (WE는 키보드 입력을 넘겨주지 않음) -->
      <div id="list-search" class="list">
        <button id="search-box" class="search-box">
          <svg viewBox="0 0 16 16"><path d="M7 1.75a5.25 5.25 0 1 0 0 10.5 5.25 5.25 0 0 0 0-10.5zM.25 7a6.75 6.75 0 1 1 12.096 4.12l3.184 3.185a.75.75 0 1 1-1.06 1.06L11.304 12.2A6.75 6.75 0 0 1 .25 7z"/></svg>
          <span id="search-text">노래, 가수, 앨범 검색</span>
        </button>
        <div id="search-results"></div>
      </div>
      <div class="scroll-track hidden"><div class="scroll-thumb"></div></div>
    </div>
  </aside>

  <script src="config.js?v=848d1d98"></script>
  <script src="web.js?v=2fe94c39"></script>
  <script src="script.js?v=f497f5f7"></script>
</body>
</html>
